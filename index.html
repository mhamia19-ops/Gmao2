<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GMAO — Atelier de Maintenance</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0e1a">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // Apply saved theme immediately, before CSS paints, to avoid a flash of the wrong theme
  (function() {
    try {
      const saved = localStorage.getItem('gmao_theme');
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #0a0e1a; --bg2: #0f1628; --bg3: #141c35; --panel: #111827;
  --border: #1e2d4d; --accent: #00c8ff; --accent2: #ff6b00; --accent3: #00ff9d;
  --danger: #ff3b5c; --warn: #ffb800; --text: #e2e8f0; --text2: #8899b4; --text3: #4a5a7a;
  --glow: 0 0 20px rgba(0,200,255,0.3); --glow2: 0 0 20px rgba(255,107,0,0.3);
  --bg-rgb: 10,14,26; --grid-line: rgba(0,200,255,0.03); --modal-glow: rgba(0,200,255,0.15);
  --font-display: 'Share Tech Mono', monospace; --font-body: 'Exo 2', sans-serif;
}
[data-theme="light"] {
  --bg: #f4f6fb; --bg2: #ffffff; --bg3: #eef1f8; --panel: #ffffff;
  --border: #d8dfec; --accent: #0086c4; --accent2: #d4540a; --accent3: #00946b;
  --danger: #d4283f; --warn: #b8790a; --text: #1a2236; --text2: #4a5a78; --text3: #8b97ad;
  --glow: 0 0 16px rgba(0,134,196,0.18); --glow2: 0 0 16px rgba(212,84,10,0.18);
  --bg-rgb: 244,246,251; --grid-line: rgba(0,134,196,0.04); --modal-glow: rgba(0,134,196,0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Exo 2', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: background 0.25s, color 0.25s; }
body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }

header { position: sticky; top: 0; z-index: 100; background: rgba(var(--bg-rgb),0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; min-height: 64px; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-text-wrap { display: flex; flex-direction: column; gap: 2px; }
.logo-title { font-size: 1.3rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); text-shadow: var(--glow); line-height: 1.1; }
.logo-title span { color: var(--accent2); text-shadow: var(--glow2); }
.logo-subtitle { font-size: 0.72rem; color: var(--text3); letter-spacing: 0.5px; text-transform: none; font-weight: 500; }
.logo-icon { width: 38px; height: 38px; border: 2px solid var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; box-shadow: var(--glow); flex-shrink: 0; }
.header-right { display: flex; align-items: center; gap: 16px; }

.alert-btn { position: relative; background: rgba(255,184,0,0.1); border: 1px solid var(--warn); color: var(--warn); padding: 7px 16px; border-radius: 6px; cursor: pointer; font-family: var(--font-body); font-size: 0.82rem; font-weight: 600; letter-spacing: 1px; transition: all 0.2s; }
.alert-btn:hover { background: rgba(255,184,0,0.2); box-shadow: 0 0 12px rgba(255,184,0,0.3); }
#notifBtn.notif-on { background: rgba(0,200,255,0.12); border-color: var(--accent); color: var(--accent); }
#notifBtn.notif-off { opacity: 0.5; }
.alert-badge { position: absolute; top: -6px; right: -6px; background: var(--danger); color: #fff; width: 18px; height: 18px; border-radius: 50%; font-size: 0.65rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.login-btn { background: linear-gradient(135deg, var(--accent), #0080aa); color: #fff; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-family: var(--font-body); font-size: 0.82rem; font-weight: 700; letter-spacing: 1px; transition: all 0.2s; box-shadow: var(--glow); }
.login-btn:hover { transform: translateY(-1px); box-shadow: 0 0 30px rgba(0,200,255,0.5); }
.admin-badge { display: flex; align-items: center; gap: 8px; background: rgba(0,255,157,0.1); border: 1px solid var(--accent3); color: var(--accent3); padding: 7px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; letter-spacing: 1px; }

nav { display: flex; gap: 0; background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; overflow-x: auto; position: relative; z-index: 1; white-space: nowrap; }
nav button { background: none; border: none; color: var(--text2); padding: 14px 20px; cursor: pointer; font-family: var(--font-body); font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
nav button:hover, nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
nav button.admin-only:hover, nav button.admin-only.active { color: var(--accent2); border-bottom-color: var(--accent2); }

main { position: relative; z-index: 1; padding: 24px; max-width: 1400px; margin: 0 auto; }
.page { display: none; }
.page.active { display: block; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.card-title { font-size: 0.75rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.card-title::before { content: ''; width: 3px; height: 16px; background: var(--accent); border-radius: 2px; display: inline-block; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; position: relative; overflow: hidden; transition: transform 0.2s; }
.stat-card:hover { transform: translateY(-2px); }
.stat-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,200,255,0.05), transparent); pointer-events: none; }
.stat-label { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; }
.stat-value { font-size: 2rem; font-weight: 900; color: var(--accent); font-family: var(--font-display); }
.stat-sub { font-size: 0.75rem; color: var(--text3); margin-top: 4px; }

.table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; }
th { background: var(--bg3); color: var(--text2); font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid rgba(30,45,77,0.5); font-size: 0.87rem; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(0,200,255,0.03); }

.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; }
.badge-ok { background: rgba(0,255,157,0.1); color: var(--accent3); border: 1px solid rgba(0,255,157,0.3); }
.badge-warn { background: rgba(255,184,0,0.1); color: var(--warn); border: 1px solid rgba(255,184,0,0.3); }
.badge-danger { background: rgba(255,59,92,0.1); color: var(--danger); border: 1px solid rgba(255,59,92,0.3); }
.badge-info { background: rgba(0,200,255,0.1); color: var(--accent); border: 1px solid rgba(0,200,255,0.3); }

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 0.72rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text2); }
.form-group input, .form-group select, .form-group textarea { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-family: var(--font-body); font-size: 0.9rem; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,200,255,0.1); }
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group select option { background: var(--bg3); }
input[type="file"]::file-selector-button { background: var(--bg2); color: var(--accent); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-right: 10px; }

.btn { padding: 10px 22px; border-radius: 8px; border: none; cursor: pointer; font-family: var(--font-body); font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; transition: all 0.2s; }
.btn-primary { background: linear-gradient(135deg, var(--accent), #007baa); color: #fff; box-shadow: var(--glow); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 25px rgba(0,200,255,0.5); }
.btn-danger { background: linear-gradient(135deg, var(--danger), #aa0020); color: #fff; }
.btn-secondary { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
.btn-secondary:hover { color: var(--text); border-color: var(--accent); }
.btn-orange { background: linear-gradient(135deg, var(--accent2), #aa4400); color: #fff; box-shadow: var(--glow2); }
.btn-sm { padding: 6px 14px; font-size: 0.75rem; }

.modal-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(5,8,20,0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 90%; max-width: 540px; box-shadow: 0 0 60px var(--modal-glow); animation: slideIn 0.25s ease; max-height: 90vh; overflow-y: auto; }
.modal-lg { max-width: 820px; }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-title { font-size: 1rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
.modal-close { background: none; border: none; color: var(--text3); font-size: 1.4rem; cursor: pointer; line-height: 1; transition: color 0.2s; }
.modal-close:hover { color: var(--danger); }

.intervention-day { margin-bottom: 28px; }
.day-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.day-label { font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); background: rgba(0,200,255,0.08); border: 1px solid rgba(0,200,255,0.2); padding: 5px 14px; border-radius: 20px; }
.day-line { flex: 1; height: 1px; background: var(--border); }
.intervention-card { background: var(--bg2); border: 1px solid var(--border); border-left: 3px solid var(--accent2); border-radius: 10px; padding: 16px; margin-bottom: 10px; transition: border-color 0.2s; }
.intervention-card:hover { border-left-color: var(--accent); }
.intervention-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.meta-tag { display: flex; align-items: center; gap: 5px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 0.78rem; color: var(--text2); }
.meta-tag strong { color: var(--text); }
.pieces-used { margin-top: 8px; }
.piece-chip { display: inline-block; background: rgba(255,107,0,0.1); border: 1px solid rgba(255,107,0,0.3); color: var(--accent2); border-radius: 5px; padding: 2px 9px; font-size: 0.75rem; margin: 2px; }
.personnel-chip { display: inline-block; background: rgba(0,200,255,0.08); border: 1px solid rgba(0,200,255,0.2); color: var(--accent); border-radius: 5px; padding: 2px 9px; font-size: 0.75rem; margin: 2px; }

.search-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
.search-bar input, .search-bar select { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 9px 14px; border-radius: 8px; font-family: var(--font-body); font-size: 0.85rem; outline: none; transition: border-color 0.2s; flex: 1; min-width: 160px; }
.search-bar input:focus, .search-bar select:focus { border-color: var(--accent); }

.pieces-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.piece-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; position: relative; overflow: hidden; transition: transform 0.2s, border-color 0.2s; }
.piece-card:hover { transform: translateY(-2px); }
.piece-card.warn { border-color: rgba(255,184,0,0.4); }
.piece-card.danger { border-color: rgba(255,59,92,0.4); }
.piece-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
.piece-cat { font-size: 0.72rem; letter-spacing: 1px; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
.piece-qty { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; }
.piece-qty.ok { color: var(--accent3); }
.piece-qty.warn { color: var(--warn); }
.piece-qty.danger { color: var(--danger); }

.emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.emp-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; transition: transform 0.2s; }
.emp-card:hover { transform: translateY(-2px); }
.emp-avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #005f88); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 700; margin: 0 auto 10px; box-shadow: var(--glow); }
.emp-name { font-weight: 700; font-size: 0.95rem; }
.emp-role { font-size: 0.75rem; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }

footer { position: relative; z-index: 1; border-top: 1px solid var(--border); margin-top: 40px; padding: 28px 24px; text-align: center; }
.footer-brand { font-size: 1rem; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.footer-sub { font-size: 0.78rem; color: var(--text3); margin-bottom: 16px; }

.piece-selector { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 6px; }
.piece-selector-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; max-height: 140px; overflow-y: auto; }
.piece-sel-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
.piece-sel-item:hover { border-color: var(--accent2); color: var(--accent2); }
.piece-sel-item.selected { background: rgba(255,107,0,0.12); border-color: var(--accent2); color: var(--accent2); }

.personnel-multi { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; min-height: 44px; }
.pers-chip { background: rgba(0,200,255,0.08); border: 1px solid rgba(0,200,255,0.2); color: var(--accent); border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; }
.pers-chip.selected { background: rgba(0,200,255,0.2); border-color: var(--accent); font-weight: 700; }
.empty { text-align: center; padding: 40px; color: var(--text3); font-size: 0.9rem; letter-spacing: 1px; }
.chart-container { position: relative; height: 300px; width: 100%; }

.fab { display: none; position: fixed; bottom: 24px; right: 24px; z-index: 500; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--accent2), #aa4400); color: #fff; border: none; font-size: 1.6rem; cursor: pointer; box-shadow: 0 4px 24px rgba(255,107,0,0.5); transition: all 0.2s; align-items: center; justify-content: center; }
.fab:hover { transform: scale(1.1); box-shadow: 0 6px 32px rgba(255,107,0,0.7); }

.chrono-display { font-family: var(--font-display); font-size: 1.1rem; color: var(--accent3); background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; display: inline-flex; align-items: center; gap: 10px; }
.chrono-btn { padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; font-family: var(--font-body); font-size: 0.78rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; transition: all 0.2s; }
.chrono-start { background: rgba(0,255,157,0.15); color: var(--accent3); border: 1px solid var(--accent3); }
.chrono-stop { background: rgba(255,59,92,0.15); color: var(--danger); border: 1px solid var(--danger); }
.chrono-reset { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }

.mic-btn { background: rgba(0,200,255,0.1); border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 10px 14px; cursor: pointer; font-size: 1rem; transition: all 0.2s; }
.mic-btn:hover { background: rgba(0,200,255,0.2); }
.mic-btn.recording { background: rgba(255,59,92,0.2); border-color: var(--danger); color: var(--danger); animation: pulse-mic 0.8s infinite; }
@keyframes pulse-mic { 0%,100%{ box-shadow: 0 0 0 0 rgba(255,59,92,0.4); } 50%{ box-shadow: 0 0 0 8px rgba(255,59,92,0); } }

.cost-tag { display: inline-flex; align-items: center; gap: 5px; background: rgba(0,255,157,0.08); border: 1px solid rgba(0,255,157,0.2); color: var(--accent3); border-radius: 6px; padding: 3px 10px; font-family: var(--font-display); font-size: 0.78rem; }

.audit-entry { display: flex; gap: 12px; padding: 10px 14px; border-bottom: 1px solid rgba(30,45,77,0.5); font-size: 0.83rem; align-items: flex-start; }
.audit-entry:last-child { border-bottom: none; }
.audit-icon { font-size: 1rem; flex-shrink: 0; margin-top: 2px; }
.audit-time { font-family: var(--font-display); font-size: 0.72rem; color: var(--text3); white-space: nowrap; }
.audit-action { color: var(--text); flex: 1; }
.audit-user { font-size: 0.72rem; color: var(--accent); }

.factory-map { display: grid; gap: 24px; }
.factory-ligne-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.factory-ligne-header { font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent2); margin-bottom: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.factory-ligne-header::before { content: ''; width: 8px; height: 8px; background: var(--accent2); border-radius: 50%; display: inline-block; box-shadow: 0 0 8px var(--accent2); }
.factory-machines-row { display: flex; flex-wrap: wrap; gap: 12px; }
.factory-machine-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; cursor: pointer; transition: all 0.2s; min-width: 150px; position: relative; }
.factory-machine-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--glow); }

.bottom-nav { display: none; }
.page.active { display: block; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⚙</div>
    <div class="logo-text-wrap">
      <div class="logo-title">GMAO <span>Atelier</span></div>
      <div class="logo-subtitle" id="currentFactorySub">Sélectionnez un projet</div>
    </div>
  </div>
  <div class="header-right">
    <button id="notifBtn" class="alert-btn notif-off" onclick="toggleWebPush()">🔔 <span class="alert-btn-label">Notif</span></button>
    <div id="authArea"></div>
  </div>
</header>

<nav id="mainNav">
  <button class="active" onclick="switchPage('dashboard')">📈 Tableau</button>
  <button onclick="switchPage('interventions')">🔧 Suivi</button>
  <button onclick="switchPage('factorymap')">🏭 Plan</button>
  <button onclick="switchPage('audit')">📜 Audit</button>
  <button onclick="switchPage('suppliers')">🛒 Fournisseurs</button>
</nav>

<main>
  <div class="page active" id="page-dashboard">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Interventions</div>
        <div class="stat-value" id="statInterventions">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Alertes Stock</div>
        <div class="stat-value" id="statAlerts" style="color:var(--danger)">0</div>
      </div>
    </div>
  </div>

  <div class="page" id="page-factorymap">
    <div class="card-title">🏭 Plan de l'Atelier</div>
    <div class="factory-map" id="factoryMap"></div>
  </div>

  <div class="page" id="page-audit">
    <div class="card-title">📜 Journal d'Audit (ISO)</div>
    <div class="card">

<script>
let sb = null;
let realtimeTeardownInProgress = false;

// Safe global service worker registration
window.addEventListener('load', () => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(console.log);
  }
  
  // Dummy local config setup for Demo/Production setup
  // Replace keys and URLs with your dynamic factory settings if needed
  initSupabaseInstance("https://your-supabase-url.supabase.co", "your-anon-key");
});

function initSupabaseInstance(url, key) {
  sb = supabase.createClient(url, key);
  document.getElementById('currentFactorySub').innerText = "Supabase Hub Connecté";
  startAppAfterFactorySelected();
}

function startAppAfterFactorySelected() {
  if (!sb) return;

  // Realtime initialization safely connected to connection handler
  const clientRealtime = sb.realtime;
  
  const completeInit = () => {
    if (navigator.onLine) {
      // Offline queues
      console.log("Online - Syncing offline queues");
    }
    loadAllData();
    initRealtimeNotifications();
  };

  if (clientRealtime && typeof clientRealtime.isConnected === 'function' && clientRealtime.isConnected()) {
    completeInit();
  } else {
    // Rely exclusively on the realtime engine protocol stream trigger event
    const removeListener = sb.realtime.onOpen(() => {
      completeInit();
      removeListener();
    });
    
    // Fallback safe timeout injection if websocket handshake gets blocked immediately
    setTimeout(() => {
      completeInit();
    }, 200);
  }
}

function loadAllData() {
  console.log("Loading operational database entities...");
  // Implement entity payload queries from public tables here
}

function initRealtimeNotifications() {
  if (realtimeTeardownInProgress || !sb) return;
  realtimeTeardownInProgress = true;
  
  // Dynamic validation cleanup of preexisting open socket paths
  ['interventions-channel', 'workorders-channel', 'pieces-channel'].forEach(name => {
    const existing = sb.getChannels().find(c => c.topic === 'realtime:' + name);
    if (existing) sb.removeChannel(existing);
  });

  setTimeout(() => { realtimeTeardownInProgress = false; }, 50);

  // Re-establish optimized database triggers through postgres_changes schemas
  sb.channel('interventions-channel')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'interventions' }, (payload) => {
       console.log('🔥 Interventions real-time update:', payload);
       loadAllData(); 
    })
    .subscribe((status) => {
       console.log('Subscription status (Interventions):', status);
    });

  sb.channel('pieces-channel')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pieces' }, (payload) => {
       console.log('🔥 Stock items real-time update:', payload);
       loadAllData();
    })
    .subscribe((status) => {
       console.log('Subscription status (Pieces):', status);
    });
}

function switchPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  
  const targetPage = document.getElementById(`page-${pageId}`);
  if (targetPage) targetPage.classList.add('active');
}

function toggleWebPush() {
  const btn = document.getElementById('notifBtn');
  if (btn.classList.contains('notif-off')) {
    btn.classList.remove('notif-off');
    btn.classList.add('notif-on');
  } else {
    btn.classList.remove('notif-on');
    btn.classList.add('notif-off');
  }
}
</script>
